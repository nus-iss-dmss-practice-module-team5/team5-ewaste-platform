name: Analytics Contracts, Kafka Delivery and MySQL Persistence

on:
  workflow_dispatch:
  pull_request:
    paths: ['src/analytics/**', 'src/backend/**', 'contracts/matching/**', 'database/**', 'scripts/test-analytics.sh', 'scripts/deploy-analytics.sh', '.github/workflows/cd-pipeline.yml', '.github/workflows/analytics.yml']
  push:
    branches: [dev, main]
    paths: ['src/analytics/**', 'src/backend/**', 'contracts/matching/**', 'database/**', 'scripts/test-analytics.sh', 'scripts/deploy-analytics.sh', '.github/workflows/cd-pipeline.yml', '.github/workflows/analytics.yml']

permissions:
  contents: read

jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify analytics against disposable Go, MySQL and Kafka services
        run: ./scripts/test-analytics.sh
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-persistence-evidence
          path: artifacts/analytics/
          retention-days: 14
