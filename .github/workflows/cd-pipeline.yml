name: CD - Multi-Environment Deployment & Evidence Pipeline

on:
  push:
    branches: [feature/EWCSB-50-Terraform-Scripts]
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Azure Runtime Environment (dev, stg, prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - stg
          - prod

permissions:
  contents: read
  id-token: write
  security-events: write
  actions: read

concurrency:
  group: cd-deployment-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME_API: 'workflow-api'
  IMAGE_NAME_UI: 'workflow-ui'

jobs:
  # ============================================================================
  # STAGE 0: DYNAMIC ENVIRONMENT RESOLUTION (2-Branch Strategy Mapping)
  # ============================================================================
  resolve-environment:
    name: Resolve Target Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env_resolver.outputs.environment }}
      is_production: ${{ steps.env_resolver.outputs.is_production }}
      deployment_desc: ${{ steps.env_resolver.outputs.deployment_desc }}
    steps:
      - name: Determine Target Environment from Git Context
        id: env_resolver
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TARGET="${{ inputs.target_env }}"
            DESC="Manual workflow dispatch to Azure $(echo $TARGET | tr '[:lower:]' '[:upper:]')"
          elif [ "${{ github.event_name }}" == "pull_request" ] && [ "${{ github.base_ref }}" == "main" ]; then
            TARGET="stg"
            DESC="48-Hour Feature Freeze PR Staging Deployment (Azure STG for Evaluation)"
          elif [ "${{ github.event_name }}" == "push" ] && [ "${{ github.ref }}" == "refs/heads/main" ]; then
            TARGET="prod"
            DESC="Merged Production Release (Azure PROD - Signed & Locked Baseline)"
          elif [ "${{ github.event_name }}" == "push" ] && [ "${{ github.ref }}" == "refs/heads/dev" ]; then
            TARGET="dev"
            DESC="Active Development Continuous Integration Sandbox (Azure DEV)"
          else
            TARGET="dev"
            DESC="Default Development Deployment (Azure DEV)"
          fi

          echo "environment=$TARGET" >> $GITHUB_OUTPUT
          echo "deployment_desc=$DESC" >> $GITHUB_OUTPUT
          
          if [ "$TARGET" == "prod" ]; then
            echo "is_production=true" >> $GITHUB_OUTPUT
          else
            echo "is_production=false" >> $GITHUB_OUTPUT
          fi

          echo "========================================================"
          echo " Target Environment: $TARGET"
          echo " Trigger Reason: $DESC"
          echo "========================================================"

  # ============================================================================
  # STAGE 1: INFRASTRUCTURE PROVISIONING (Native Terraform Apply)
  # ============================================================================
  provision-infrastructure:
    name: Terraform Apply (${{ needs.resolve-environment.outputs.environment }})
    needs: [resolve-environment]
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-environment.outputs.environment }}
    outputs:
      acr_server: ${{ steps.tf_outputs.outputs.acr_server }}
      aca_env_name: ${{ steps.tf_outputs.outputs.aca_env_name }}
      resource_group: ${{ steps.tf_outputs.outputs.resource_group }}
      mysql_fqdn: ${{ steps.tf_outputs.outputs.mysql_fqdn }}
      mysql_db: ${{ steps.tf_outputs.outputs.mysql_db }}
      mysql_admin_password: ${{ steps.tf_outputs.outputs.mysql_admin_password }}
      aca_identity_id: ${{ steps.tf_outputs.outputs.aca_identity_id }}
      aca_api_fqdn: ${{ steps.tf_outputs.outputs.aca_api_fqdn }}
      aca_ui_fqdn: ${{ steps.tf_outputs.outputs.aca_ui_fqdn }}
      key_vault_uri: ${{ steps.tf_outputs.outputs.key_vault_uri }}
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Authenticate to Microsoft Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Register Azure Resource Providers
        run: |
          echo "Registering Azure Container Apps and Monitor resource providers..."
          az provider register --namespace Microsoft.App --wait
          az provider register --namespace Microsoft.OperationalInsights --wait
          az provider register --namespace Microsoft.ContainerService --wait

      - name: Set ARM Credentials for Terraform
        run: |
          CLIENT_SECRET=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .clientSecret)
          echo "::add-mask::$CLIENT_SECRET"
          echo "ARM_CLIENT_SECRET=$CLIENT_SECRET" >> $GITHUB_ENV
          echo "ARM_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}" >> $GITHUB_ENV
          echo "ARM_ACCESS_KEY=${{ secrets.TF_STATE_SA_ACCESS_KEY }}" >> $GITHUB_ENV

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      # ------------------------------------------------------------------------
      # 1.1. SHARED INFRASTRUCTURE (ACR & Log Analytics Workspace)
      # ------------------------------------------------------------------------
      - name: Apply Shared Infrastructure
        run: |
          cd terraform/shared
          terraform init \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=shared.tfstate" \
            -backend-config="access_key=${{ secrets.TF_STATE_SA_ACCESS_KEY }}"

          terraform apply -auto-approve

      # ------------------------------------------------------------------------
      # 1.2. ENVIRONMENT INFRASTRUCTURE (VNet, DB, Redis, Key Vault, Container Apps)
      # ------------------------------------------------------------------------
      - name: Apply Target Environment Infrastructure
        run: |
          TARGET_ENV="${{ needs.resolve-environment.outputs.environment }}"
          cd terraform/environments
          terraform init \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=$TARGET_ENV.tfstate" \
            -backend-config="access_key=${{ secrets.TF_STATE_SA_ACCESS_KEY }}"

          TF_VARS_FILE="environments/$TARGET_ENV.tfvars"
          if [ ! -f "$TF_VARS_FILE" ]; then
            TF_VARS_FILE="environments/dev.tfvars"
          fi

          terraform apply -auto-approve \
            -var-file="$TF_VARS_FILE" \
            -var="environment=$TARGET_ENV" \
            -var="tenant_id=${{ secrets.AZURE_TENANT_ID }}"

            # ------------------------------------------------------------------------
      # 1.3. EXPORT OUTPUTS FOR SUBSEQUENT STAGES
      # ------------------------------------------------------------------------
      - name: Export Deployment Outputs
        id: tf_outputs
        run: |
          TARGET_ENV="${{ needs.resolve-environment.outputs.environment }}"
          cd terraform/environments

          ACR_SERVER=$(terraform output -raw acr_login_server 2>/dev/null || echo "")
          if [ -z "$ACR_SERVER" ]; then
            ACR_SERVER="acrewasteplatform.azurecr.io"
          fi

          MYSQL_FQDN=$(terraform output -raw mysql_fqdn 2>/dev/null || echo "")
          MYSQL_DB=$(terraform output -raw mysql_database_name 2>/dev/null || echo "ewastedb")
          ACA_API_FQDN=$(terraform output -raw aca_api_fqdn 2>/dev/null || echo "")
          ACA_UI_FQDN=$(terraform output -raw aca_ui_fqdn 2>/dev/null || echo "")
          KV_URI=$(terraform output -raw key_vault_uri 2>/dev/null || echo "")
          MYSQL_PASS=$(terraform output -raw mysql_admin_password 2>/dev/null || echo "${{ secrets.DB_PASSWORD }}")
          ACA_IDENTITY_ID=$(terraform output -raw aca_identity_id 2>/dev/null || echo "")

          if [ -n "$MYSQL_PASS" ]; then
            echo "::add-mask::$MYSQL_PASS"
          fi

          {
            echo "acr_server=${ACR_SERVER}"
            echo "aca_env_name=cae-ewaste-${TARGET_ENV}"
            echo "resource_group=rg-ewaste-${TARGET_ENV}"
            echo "mysql_fqdn=${MYSQL_FQDN}"
            echo "mysql_db=${MYSQL_DB}"
            echo "aca_api_fqdn=${ACA_API_FQDN}"
            echo "aca_ui_fqdn=${ACA_UI_FQDN}"
            echo "key_vault_uri=${KV_URI}"
            echo "mysql_admin_password=${MYSQL_PASS}"
            echo "aca_identity_id=${ACA_IDENTITY_ID}"
          } >> "$GITHUB_OUTPUT"

  # ============================================================================
  # STAGE 2: PRIVATE DATABASE MIGRATIONS (Liquibase via ACA Job)
  # ============================================================================
  database-migration:
    name: Liquibase Migration (${{ needs.resolve-environment.outputs.environment }})
    needs: [resolve-environment, provision-infrastructure]
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-environment.outputs.environment }}
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Authenticate to Microsoft Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build & Publish Ephemeral Migration Container via SP
        run: |
          ACR_NAME="${{ secrets.AZURE_ACR_NAME }}"
          if [ -z "$ACR_NAME" ]; then ACR_NAME="acrewasteplatform"; fi

          MIGRATION_IMAGE="${{ needs.provision-infrastructure.outputs.acr_server }}/db-migrator:${{ github.sha }}"
          mkdir -p db/changelog

          # Create inline Dockerfile for Liquibase
          cat <<'EOF' > db/Dockerfile
          FROM liquibase/liquibase:4.27
          COPY changelog /liquibase/changelog
          EOF

          # Build and push directly inside Azure using Service Principal
          az acr build \
            --registry "$ACR_NAME" \
            --image "db-migrator:${{ github.sha }}" \
            --file db/Dockerfile \
            db/

          echo "MIGRATION_IMAGE=$MIGRATION_IMAGE" >> $GITHUB_ENV

      - name: Retrieve Database Password from Azure Key Vault
        uses: azure/cli@v2
        id: kv_secret
        with:
          inlineScript: |
            DB_PASS=$(az keyvault secret show \
              --name mysql-admin-password \
              --vault-name kv-ewaste-${{ needs.resolve-environment.outputs.environment }} \
              --query value -o tsv 2>/dev/null || echo "${{ secrets.DB_PASSWORD }}")
            echo "::add-mask::$DB_PASS"
            echo "db_pass=$DB_PASS" >> $GITHUB_OUTPUT

      - name: Execute Migration Inside VNet Boundary
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -e
            JOB_NAME="job-db-migrate-${{ github.sha }}"
            JDBC_URL="jdbc:mysql://${{ needs.provision-infrastructure.outputs.mysql_fqdn }}:3306/${{ needs.provision-infrastructure.outputs.mysql_db }}?useSSL=true&requireSSL=true"
            DB_PASS="${{ needs.provision-infrastructure.outputs.mysql_admin_password }}"
            IDENTITY_ID="${{ needs.provision-infrastructure.outputs.aca_identity_id }}"
            ACR_SERVER="${{ needs.provision-infrastructure.outputs.acr_server }}"

            echo "Creating ephemeral ACA migration job inside VNet for ${{ needs.resolve-environment.outputs.environment }}..."
            az containerapp job create \
              --name "$JOB_NAME" \
              --resource-group "${{ needs.provision-infrastructure.outputs.resource_group }}" \
              --environment "${{ needs.provision-infrastructure.outputs.aca_env_name }}" \
              --mi-user-assigned "$IDENTITY_ID" \
              --registry-server "$ACR_SERVER" \
              --registry-identity "$IDENTITY_ID" \
              --trigger-type "Manual" \
              --replica-timeout 300 \
              --replica-retry-limit 0 \
              --image "${{ env.MIGRATION_IMAGE }}" \
              --args "update" \
                     "--changelog-file=/liquibase/changelog/db.changelog-master.xml" \
                     "--url=$JDBC_URL" \
                     "--username=ewasteadmin" \
                     "--password=$DB_PASS"

            echo "Starting migration execution..."
            az containerapp job start \
              --name "$JOB_NAME" \
              --resource-group "${{ needs.provision-infrastructure.outputs.resource_group }}"

            echo "Polling migration execution status..."
            for i in {1..15}; do
              STATUS=$(az containerapp job execution list \
                --name "$JOB_NAME" \
                --resource-group "${{ needs.provision-infrastructure.outputs.resource_group }}" \
                --query "[0].status" -o tsv)
              echo "Status: $STATUS (Attempt $i/15)"
              if [ "$STATUS" == "Succeeded" ]; then
                echo "Liquibase migrations applied successfully."
                break
              elif [ "$STATUS" == "Failed" ]; then
                echo "ERROR: Liquibase migration execution failed."
                az containerapp job delete --name "$JOB_NAME" --resource-group "${{ needs.provision-infrastructure.outputs.resource_group }}" --yes 2>/dev/null || true
                exit 1
              fi
              sleep 10
            done

            echo "Cleaning up ephemeral migration job..."
            az containerapp job delete \
              --name "$JOB_NAME" \
              --resource-group "${{ needs.provision-infrastructure.outputs.resource_group }}" \
              --yes

