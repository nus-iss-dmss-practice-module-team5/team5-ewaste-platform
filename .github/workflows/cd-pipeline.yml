name: CD - Multi-Environment Deployment & Evidence Pipeline

on:
  push:
    branches: [feature/add-kafka-resource-terraform]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Azure Runtime Environment (dev, stg, prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - stg
          - prod
      rollback_tag:
        description: 'Optional: Image tag to rollback to (e.g. dev-a1b2c3d). Leave empty for standard build.'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write
  security-events: write
  actions: read

concurrency:
  group: cd-deployment-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME_API: 'workflow-api'
  IMAGE_NAME_UI: 'workflow-ui'
  IMAGE_NAME_ANALYTICS: 'workflow-analytics'

jobs:
  # ============================================================================
  # STAGE 0: DYNAMIC ENVIRONMENT RESOLUTION (2-Branch Strategy Mapping)
  # ============================================================================
  resolve-environment:
    name: Resolve Target Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env_resolver.outputs.environment }}
      is_production: ${{ steps.env_resolver.outputs.is_production }}
      deployment_desc: ${{ steps.env_resolver.outputs.deployment_desc }}
      resource_group: ${{ steps.env_resolver.outputs.resource_group }}
      aca_env_name: ${{ steps.env_resolver.outputs.aca_env_name }}
      mysql_fqdn: ${{ steps.env_resolver.outputs.mysql_fqdn }}
      mysql_db: ${{ steps.env_resolver.outputs.mysql_db }}
      mysql_admin_username: ${{ steps.env_resolver.outputs.mysql_admin_username }}
      redis_address: ${{ steps.env_resolver.outputs.redis_address }}
    steps:
      - name: Determine Target Environment from Git Context
        id: env_resolver
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TARGET="${{ inputs.target_env }}"
            DESC="Manual workflow dispatch to Azure $(echo $TARGET | tr '[:lower:]' '[:upper:]')"
          elif [ "${{ github.event_name }}" == "pull_request" ] && [ "${{ github.base_ref }}" == "main" ]; then
            TARGET="stg"
            DESC="48-Hour Feature Freeze PR Staging Deployment (Azure STG for Evaluation)"
          elif [ "${{ github.event_name }}" == "push" ] && [ "${{ github.ref }}" == "refs/heads/main" ]; then
            TARGET="prod"
            DESC="Merged Production Release (Azure PROD - Signed & Locked Baseline)"
          elif [ "${{ github.event_name }}" == "push" ] && [ "${{ github.ref }}" == "refs/heads/dev" ]; then
            TARGET="dev"
            DESC="Active Development Continuous Integration Sandbox (Azure DEV)"
          else
            TARGET="dev"
            DESC="Default Development Deployment (Azure DEV)"
          fi

          echo "environment=$TARGET" >> $GITHUB_OUTPUT
          echo "deployment_desc=$DESC" >> $GITHUB_OUTPUT

          if [ "$TARGET" == "prod" ]; then
            echo "is_production=true" >> $GITHUB_OUTPUT
          else
            echo "is_production=false" >> $GITHUB_OUTPUT
          fi

          # Deterministic Infrastructure Topology Bindings
          echo "resource_group=rg-ewaste-${TARGET}" >> $GITHUB_OUTPUT
          echo "aca_env_name=cae-ewaste-${TARGET}" >> $GITHUB_OUTPUT
          echo "mysql_fqdn=mysql-ewaste-${TARGET}.mysql.database.azure.com" >> $GITHUB_OUTPUT
          echo "mysql_db=ewastedb" >> $GITHUB_OUTPUT
          echo "mysql_admin_username=ewasteadmin" >> $GITHUB_OUTPUT
          echo "redis_address=redis-ewaste-${TARGET}.redis.cache.windows.net:6380" >> $GITHUB_OUTPUT

          echo "========================================================"
          echo " Target Environment: $TARGET"
          echo " Trigger Reason: $DESC"
          echo " Resource Group: rg-ewaste-${TARGET}"
          echo " ACA Environment: cae-ewaste-${TARGET}"
          echo "========================================================"

  # ============================================================================
  # STAGE 1: MULTI-CONTAINER RELEASE (API, UI & ANALYTICS) & ACA DEPLOYMENT
  # ============================================================================
  deploy-application:
    name: Package & Deploy (API, UI & Analytics - ${{ needs.resolve-environment.outputs.environment }})
    needs: [resolve-environment]
    runs-on: [ubuntu-latest]
    environment: ${{ needs.resolve-environment.outputs.environment }}
    outputs:
      aca_api_fqdn: ${{ steps.api_deploy.outputs.aca_api_fqdn }}
      aca_ui_fqdn: ${{ steps.ui_deploy.outputs.aca_ui_fqdn }}
      aca_analytics_fqdn: ${{ steps.analytics_deploy.outputs.aca_analytics_fqdn }}
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Authenticate to Microsoft Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Sigstore Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Log in to Azure Container Registry
        run: |
          ACR_SERVER="${{ secrets.AZURE_ACR_NAME }}.azurecr.io"
          ACR_NAME=$(echo "$ACR_SERVER" | cut -d'.' -f1)
          az acr login --name "$ACR_NAME"

      # ------------------------------------------------------------------------
      # 1.1 BACKEND API CONTAINER
      # ------------------------------------------------------------------------
      - name: Build & Publish Backend API Container
        run: |
          ACR_SERVER="${{ secrets.AZURE_ACR_NAME }}.azurecr.io"
          TARGET_ENV="${{ needs.resolve-environment.outputs.environment }}"

          if [ -n "${{ inputs.rollback_tag }}" ]; then
            IMAGE_TAG="${ACR_SERVER}/${{ env.IMAGE_NAME_API }}:${{ inputs.rollback_tag }}"
            echo "Rolling back to existing API image: $IMAGE_TAG"
            docker pull "$IMAGE_TAG" || true
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            IMAGE_TAG="${ACR_SERVER}/${{ env.IMAGE_NAME_API }}:${TARGET_ENV}-${SHORT_SHA}"
            echo "Building API image: $IMAGE_TAG"
            docker build -t "$IMAGE_TAG" -f src/backend/Dockerfile src/backend/
            echo "Pushing API image to ACR..."
            docker push "$IMAGE_TAG"
          fi
          echo "API_IMAGE=$IMAGE_TAG" >> $GITHUB_ENV

          API_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_TAG" 2>/dev/null || echo "$IMAGE_TAG")
          echo "API_IMMUTABLE_DIGEST=$API_DIGEST" >> $GITHUB_ENV

#      - name: Sign API Container Image Digest with Cosign
#        run: |
#          echo "Signing immutable API image digest: ${{ env.API_IMMUTABLE_DIGEST }}"
#          if [ -n "${{ secrets.COSIGN_PRIVATE_KEY }}" ]; then
#            cosign sign --yes \
#              --key env://COSIGN_PRIVATE_KEY \
#              ${{ env.API_IMMUTABLE_DIGEST }}
#          else
#            echo "Generating ephemeral keypair for API signing..."
#            if [ ! -f cosign.key ]; then
#              cosign generate-key-pair
#            fi
#            cosign sign --yes --key cosign.key ${{ env.API_IMMUTABLE_DIGEST }}
#          fi
#        env:
#          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
#          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}

      - name: Deploy API Container to Azure Container Apps
        id: api_deploy
        uses: azure/cli@v2
        with:
          inlineScript: |
            TARGET_ENV="${{ needs.resolve-environment.outputs.environment }}"
            RG="${{ needs.resolve-environment.outputs.resource_group }}"
            CAE="${{ needs.resolve-environment.outputs.aca_env_name }}"
            ACR_SERVER="${{ secrets.AZURE_ACR_NAME }}.azurecr.io"
            DB_HOST="${{ needs.resolve-environment.outputs.mysql_fqdn }}"
            DB_PASS="${{ secrets.MYSQL_DB_ADMIN_PASSWORD }}"
            DB_USER="${{ needs.resolve-environment.outputs.mysql_admin_username }}"
            DB_NAME="${{ needs.resolve-environment.outputs.mysql_db }}"
            REDIS_PASS="${{ secrets.REDIS_PASSWORD }}"
            AUTH_ACCESS_SECRET="${{ secrets.EWASTE_AUTH_ACCESS_SECRET }}"
            AUTH_REFRESH_SECRET="${{ secrets.EWASTE_AUTH_REFRESH_SECRET }}"
            AUTH_REFRESH_HASH_SECRET="${{ secrets.EWASTE_AUTH_REFRESH_HASH_SECRET }}"
            APP_NAME="aca-ewaste-${TARGET_ENV}-api"

            if [ "$TARGET_ENV" == "dev" ]; then
              APP_MODE="development"
            else
              APP_MODE="production"
            fi

            DB_USER="${DB_USER:-ewasteadmin}"
            DB_NAME="${DB_NAME:-ewastedb}"
            REDIS_ADDR="redis-ewaste-${TARGET_ENV}.redis.cache.windows.net:6380"

            if [ -z "$REDIS_PASS" ] || [ "$REDIS_PASS" == "defaultRedisPass123!" ]; then
              REDIS_NAME="redis-ewaste-${TARGET_ENV}"
              FETCHED_KEY=$(az redis list-keys --name "$REDIS_NAME" --resource-group "$RG" --query primaryKey -o tsv 2>/dev/null || true)
              if [ -n "$FETCHED_KEY" ]; then
                echo "::add-mask::$FETCHED_KEY"
                REDIS_PASS="$FETCHED_KEY"
              fi
            fi
            REDIS_PASS="${REDIS_PASS:-defaultRedisPass123!}"

            AUTH_ACCESS_SECRET="${AUTH_ACCESS_SECRET:-default-dev-access-secret-minimum-32-chars-long}"
            AUTH_REFRESH_SECRET="${AUTH_REFRESH_SECRET:-default-dev-refresh-secret-minimum-32-chars-long}"
            AUTH_REFRESH_HASH_SECRET="${AUTH_REFRESH_HASH_SECRET:-default-dev-refresh-hash-secret-32-chars}"

            IDENTITY=$(az identity show --name "id-ewaste-${TARGET_ENV}" --resource-group "$RG" --query id -o tsv 2>/dev/null || true)

            echo "Deploying Backend API Container App ($APP_NAME)..."
            if az containerapp show --name "$APP_NAME" --resource-group "$RG" >/dev/null 2>&1; then
              echo "Container App $APP_NAME already exists. Ensuring ingress target-port is 8080..."
              az containerapp ingress enable \
                --name "$APP_NAME" \
                --resource-group "$RG" \
                --type external \
                --target-port 8080 || true

              echo "Updating secrets and container image..."
              az containerapp secret set \
                --name "$APP_NAME" \
                --resource-group "$RG" \
                --secrets db-password="$DB_PASS" \
                          redis-password="$REDIS_PASS" \
                          access-secret="$AUTH_ACCESS_SECRET" \
                          refresh-secret="$AUTH_REFRESH_SECRET" \
                          refresh-hash-secret="$AUTH_REFRESH_HASH_SECRET" || true

              az containerapp update \
                --name "$APP_NAME" \
                --resource-group "$RG" \
                --image "${{ env.API_IMMUTABLE_DIGEST }}" \
                --set-env-vars EWASTE_MODE="$APP_MODE" \
                               EWASTE_SERVER_PORT=":8080" \
                               EWASTE_DATABASE_HOST="$DB_HOST" \
                               EWASTE_DATABASE_PORT="3306" \
                               EWASTE_DATABASE_NAME="ewastedb" \
                               EWASTE_DATABASE_USER="ewasteadmin" \
                               MYSQL_PASSWORD=secretref:db-password \
                               EWASTE_DATABASE_PASSWORD=secretref:db-password \
                               EWASTE_REDIS_ADDRESS="$REDIS_ADDR" \
                               REDIS_PASSWORD=secretref:redis-password \
                               EWASTE_REDIS_PASSWORD=secretref:redis-password \
                               EWASTE_REDIS_DB="0" \
                               EWASTE_REDIS_TLS_ENABLED="true" \
                               EWASTE_AUTH_ISSUER="ewaste-workflow-api" \
                               EWASTE_AUTH_ACCESS_SECRET=secretref:access-secret \
                               EWASTE_AUTH_REFRESH_SECRET=secretref:refresh-secret \
                               EWASTE_AUTH_REFRESH_HASH_SECRET=secretref:refresh-hash-secret \
                               EWASTE_AUTH_ACCESS_TTL="15m" \
                               EWASTE_AUTH_REFRESH_TTL="24h" \
                               EWASTE_RATE_LIMIT_REQUESTS="10" \
                               EWASTE_RATE_LIMIT_WINDOW="1m" \
                               EWASTE_LOGGING_LEVEL="info" \
                               EWASTE_LOGGING_FILE_PATH="logs/workflow-api.log" \
                               EWASTE_LOGGING_MAX_SIZE_MB="10" \
                               EWASTE_LOGGING_MAX_BACKUPS="5" \
                               EWASTE_LOGGING_MAX_AGE_DAYS="30" \
                               EWASTE_LOGGING_COMPRESS="true" \
                               EWASTE_LOGGING_CONSOLE="true"
            else
              echo "Container App $APP_NAME does not exist. Creating new container app..."
              if [ -n "$IDENTITY" ]; then
                az containerapp create \
                  --name "$APP_NAME" \
                  --resource-group "$RG" \
                  --environment "$CAE" \
                  --image "${{ env.API_IMMUTABLE_DIGEST }}" \
                  --target-port 8080 \
                  --ingress external \
                  --min-replicas 1 \
                  --max-replicas 2 \
                  --cpu 0.5 \
                  --memory 1.0Gi \
                  --user-assigned "$IDENTITY" \
                  --registry-server "$ACR_SERVER" \
                  --registry-identity "$IDENTITY" \
                  --secrets db-password="$DB_PASS" \
                            redis-password="$REDIS_PASS" \
                            access-secret="$AUTH_ACCESS_SECRET" \
                            refresh-secret="$AUTH_REFRESH_SECRET" \
                            refresh-hash-secret="$AUTH_REFRESH_HASH_SECRET" \
                  --env-vars EWASTE_MODE="$APP_MODE" \
                             EWASTE_SERVER_PORT=":8080" \
                             EWASTE_DATABASE_HOST="$DB_HOST" \
                             EWASTE_DATABASE_PORT="3306" \
                             EWASTE_DATABASE_NAME="ewastedb" \
                             EWASTE_DATABASE_USER="ewasteadmin" \
                             MYSQL_PASSWORD=secretref:db-password \
                             EWASTE_DATABASE_PASSWORD=secretref:db-password \
                             EWASTE_REDIS_ADDRESS="$REDIS_ADDR" \
                             REDIS_PASSWORD=secretref:redis-password \
                             EWASTE_REDIS_PASSWORD=secretref:redis-password \
                             EWASTE_REDIS_DB="0" \
                             EWASTE_REDIS_TLS_ENABLED="true" \
                             EWASTE_AUTH_ISSUER="ewaste-workflow-api" \
                             EWASTE_AUTH_ACCESS_SECRET=secretref:access-secret \
                             EWASTE_AUTH_REFRESH_SECRET=secretref:refresh-secret \
                             EWASTE_AUTH_REFRESH_HASH_SECRET=secretref:refresh-hash-secret \
                             EWASTE_AUTH_ACCESS_TTL="15m" \
                             EWASTE_AUTH_REFRESH_TTL="24h" \
                             EWASTE_RATE_LIMIT_REQUESTS="10" \
                             EWASTE_RATE_LIMIT_WINDOW="1m" \
                             EWASTE_LOGGING_LEVEL="info" \
                             EWASTE_LOGGING_FILE_PATH="logs/workflow-api.log" \
                             EWASTE_LOGGING_MAX_SIZE_MB="10" \
                             EWASTE_LOGGING_MAX_BACKUPS="5" \
                             EWASTE_LOGGING_MAX_AGE_DAYS="30" \
                             EWASTE_LOGGING_COMPRESS="true" \
                             EWASTE_LOGGING_CONSOLE="true"
              else
                az containerapp create \
                  --name "$APP_NAME" \
                  --resource-group "$RG" \
                  --environment "$CAE" \
                  --image "${{ env.API_IMMUTABLE_DIGEST }}" \
                  --target-port 8080 \
                  --ingress external \
                  --min-replicas 1 \
                  --max-replicas 2 \
                  --cpu 0.5 \
                  --memory 1.0Gi \
                  --registry-server "$ACR_SERVER" \
                  --secrets db-password="$DB_PASS" \
                            redis-password="$REDIS_PASS" \
                            access-secret="$AUTH_ACCESS_SECRET" \
                            refresh-secret="$AUTH_REFRESH_SECRET" \
                            refresh-hash-secret="$AUTH_REFRESH_HASH_SECRET" \
                  --env-vars EWASTE_MODE="$APP_MODE" \
                             EWASTE_SERVER_PORT=":8080" \
                             EWASTE_DATABASE_HOST="$DB_HOST" \
                             EWASTE_DATABASE_PORT="3306" \
                             EWASTE_DATABASE_NAME="ewastedb" \
                             EWASTE_DATABASE_USER="ewasteadmin" \
                             MYSQL_PASSWORD=secretref:db-password \
                             EWASTE_DATABASE_PASSWORD=secretref:db-password \
                             EWASTE_REDIS_ADDRESS="$REDIS_ADDR" \
                             REDIS_PASSWORD=secretref:redis-password \
                             EWASTE_REDIS_PASSWORD=secretref:redis-password \
                             EWASTE_REDIS_DB="0" \
                             EWASTE_REDIS_TLS_ENABLED="true" \
                             EWASTE_AUTH_ISSUER="ewaste-workflow-api" \
                             EWASTE_AUTH_ACCESS_SECRET=secretref:access-secret \
                             EWASTE_AUTH_REFRESH_SECRET=secretref:refresh-secret \
                             EWASTE_AUTH_REFRESH_HASH_SECRET=secretref:refresh-hash-secret \
                             EWASTE_AUTH_ACCESS_TTL="15m" \
                             EWASTE_AUTH_REFRESH_TTL="24h" \
                             EWASTE_RATE_LIMIT_REQUESTS="10" \
                             EWASTE_RATE_LIMIT_WINDOW="1m" \
                             EWASTE_LOGGING_LEVEL="info" \
                             EWASTE_LOGGING_FILE_PATH="logs/workflow-api.log" \
                             EWASTE_LOGGING_MAX_SIZE_MB="10" \
                             EWASTE_LOGGING_MAX_BACKUPS="5" \
                             EWASTE_LOGGING_MAX_AGE_DAYS="30" \
                             EWASTE_LOGGING_COMPRESS="true" \
                             EWASTE_LOGGING_CONSOLE="true"
              fi
            fi

            API_FQDN=$(az containerapp show --name "$APP_NAME" --resource-group "$RG" --query "properties.configuration.ingress.fqdn" -o tsv)
            echo "aca_api_fqdn=$API_FQDN" >> "$GITHUB_OUTPUT"
            echo "API FQDN: https://$API_FQDN"

      # ------------------------------------------------------------------------
      # 1.2 FRONTEND UI CONTAINER
      # ------------------------------------------------------------------------
      - name: Build & Publish Frontend UI Container
        run: |
          ACR_SERVER="${{ secrets.AZURE_ACR_NAME }}.azurecr.io"
          TARGET_ENV="${{ needs.resolve-environment.outputs.environment }}"
          API_URL="https://${{ steps.api_deploy.outputs.aca_api_fqdn }}"

          if [ -n "${{ inputs.rollback_tag }}" ]; then
            IMAGE_TAG="${ACR_SERVER}/${{ env.IMAGE_NAME_UI }}:${{ inputs.rollback_tag }}"
            echo "Rolling back to existing UI image: $IMAGE_TAG"
            docker pull "$IMAGE_TAG" || true
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            IMAGE_TAG="${ACR_SERVER}/${{ env.IMAGE_NAME_UI }}:${TARGET_ENV}-${SHORT_SHA}"
            echo "Building UI image: $IMAGE_TAG"
            docker build -t "$IMAGE_TAG" \
              --build-arg NEXT_PUBLIC_API_URL="$API_URL" \
              --build-arg NEXT_PUBLIC_API_BASE_URL="$API_URL" \
              --build-arg API_PROXY_TARGET="$API_URL" \
              --build-arg NEXT_PUBLIC_USE_MOCK_AUTH="false" \
              -f src/frontend/Dockerfile src/frontend/
            echo "Pushing UI image to ACR..."
            docker push "$IMAGE_TAG"
          fi
          echo "UI_IMAGE=$IMAGE_TAG" >> $GITHUB_ENV

          UI_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_TAG" 2>/dev/null || echo "$IMAGE_TAG")
          echo "UI_IMMUTABLE_DIGEST=$UI_DIGEST" >> $GITHUB_ENV

#      - name: Sign UI Container Image Digest with Cosign
#        run: |
#          echo "Signing immutable UI image digest: ${{ env.UI_IMMUTABLE_DIGEST }}"
#          if [ -n "${{ secrets.COSIGN_PRIVATE_KEY }}" ]; then
#            cosign sign --yes \
#              --key env://COSIGN_PRIVATE_KEY \
#              ${{ env.UI_IMMUTABLE_DIGEST }}
#          else
#            echo "Signing UI image with cosign key..."
#            if [ ! -f cosign.key ]; then
#              cosign generate-key-pair
#            fi
#            cosign sign --yes --key cosign.key ${{ env.UI_IMMUTABLE_DIGEST }}
#          fi
#        env:
#          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
#          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}

      - name: Deploy UI Container to Azure Container Apps
        id: ui_deploy
        uses: azure/cli@v2
        with:
          inlineScript: |
            TARGET_ENV="${{ needs.resolve-environment.outputs.environment }}"
            RG="${{ needs.resolve-environment.outputs.resource_group }}"
            CAE="${{ needs.resolve-environment.outputs.aca_env_name }}"
            ACR_SERVER="${{ secrets.AZURE_ACR_NAME }}.azurecr.io"
            API_FQDN="${{ steps.api_deploy.outputs.aca_api_fqdn }}"
            if [ -z "$API_FQDN" ]; then
              API_FQDN=$(az containerapp show --name "aca-ewaste-${TARGET_ENV}-api" --resource-group "$RG" --query "properties.configuration.ingress.fqdn" -o tsv 2>/dev/null || true)
            fi
            API_URL="https://${API_FQDN}"
            APP_NAME="aca-ewaste-${TARGET_ENV}-ui"

            IDENTITY=$(az identity show --name "id-ewaste-${TARGET_ENV}" --resource-group "$RG" --query id -o tsv 2>/dev/null || true)

            echo "Deploying Frontend UI Container App ($APP_NAME)..."
            if az containerapp show --name "$APP_NAME" --resource-group "$RG" >/dev/null 2>&1; then
              echo "Container App $APP_NAME already exists. Ensuring ingress target-port is 3000..."
              az containerapp ingress enable \
                --name "$APP_NAME" \
                --resource-group "$RG" \
                --type external \
                --target-port 3000 || true

              echo "Updating container image and environment..."
              az containerapp update \
                --name "$APP_NAME" \
                --resource-group "$RG" \
                --image "${{ env.UI_IMMUTABLE_DIGEST }}" \
                --set-env-vars APP_ENV="$TARGET_ENV" \
                               NEXT_PUBLIC_API_URL="$API_URL" \
                               NEXT_PUBLIC_API_BASE_URL="$API_URL" \
                               API_PROXY_TARGET="$API_URL" \
                               NEXT_PUBLIC_USE_MOCK_AUTH="false" \
                               NODE_ENV="production" \
                               PORT="3000"
            else
              echo "Container App $APP_NAME does not exist. Creating new container app..."
              if [ -n "$IDENTITY" ]; then
                az containerapp create \
                  --name "$APP_NAME" \
                  --resource-group "$RG" \
                  --environment "$CAE" \
                  --image "${{ env.UI_IMMUTABLE_DIGEST }}" \
                  --target-port 3000 \
                  --ingress external \
                  --min-replicas 1 \
                  --max-replicas 2 \
                  --cpu 0.5 \
                  --memory 1.0Gi \
                  --user-assigned "$IDENTITY" \
                  --registry-server "$ACR_SERVER" \
                  --registry-identity "$IDENTITY" \
                  --env-vars APP_ENV="$TARGET_ENV" \
                             NEXT_PUBLIC_API_URL="$API_URL" \
                             NEXT_PUBLIC_API_BASE_URL="$API_URL" \
                             API_PROXY_TARGET="$API_URL" \
                             NEXT_PUBLIC_USE_MOCK_AUTH="false" \
                             NODE_ENV="production" \
                             PORT="3000"
              else
                az containerapp create \
                  --name "$APP_NAME" \
                  --resource-group "$RG" \
                  --environment "$CAE" \
                  --image "${{ env.UI_IMMUTABLE_DIGEST }}" \
                  --target-port 3000 \
                  --ingress external \
                  --min-replicas 1 \
                  --max-replicas 2 \
                  --cpu 0.5 \
                  --memory 1.0Gi \
                  --registry-server "$ACR_SERVER" \
                  --env-vars APP_ENV="$TARGET_ENV" \
                             NEXT_PUBLIC_API_URL="$API_URL" \
                             NEXT_PUBLIC_API_BASE_URL="$API_URL" \
                             API_PROXY_TARGET="$API_URL" \
                             NEXT_PUBLIC_USE_MOCK_AUTH="false" \
                             NODE_ENV="production" \
                             PORT="3000"
              fi
            fi

            UI_FQDN=$(az containerapp show --name "$APP_NAME" --resource-group "$RG" --query "properties.configuration.ingress.fqdn" -o tsv)
            echo "aca_ui_fqdn=$UI_FQDN" >> "$GITHUB_OUTPUT"
            echo "UI FQDN: https://$UI_FQDN"

      # ------------------------------------------------------------------------
      # 1.3 ANALYTICS WORKER CONTAINER
      # ------------------------------------------------------------------------
      - name: Build and Push Analytics Worker Image to ACR
        run: |
          TARGET_ENV="${{ needs.resolve-environment.outputs.environment }}"
          ACR_SERVER="${{ secrets.AZURE_ACR_NAME }}.azurecr.io"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE_TAG="${ACR_SERVER}/${{ env.IMAGE_NAME_ANALYTICS }}:${TARGET_ENV}-${SHORT_SHA}"

          echo "Building Analytics Worker image: $IMAGE_TAG"
          docker build -t "$IMAGE_TAG" -f src/analytics/Dockerfile src/analytics/

          echo "Pushing Analytics Worker image to ACR..."
          docker push "$IMAGE_TAG"

          ANALYTICS_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_TAG" 2>/dev/null || echo "$IMAGE_TAG")
          echo "ANALYTICS_IMMUTABLE_DIGEST=$ANALYTICS_DIGEST" >> $GITHUB_ENV

      - name: Deploy Analytics Worker to Azure Container Apps
        id: analytics_deploy
        uses: azure/cli@v2
        with:
          inlineScript: |
            TARGET_ENV="${{ needs.resolve-environment.outputs.environment }}"
            RG="${{ needs.resolve-environment.outputs.resource_group }}"
            CAE="${{ needs.resolve-environment.outputs.aca_env_name }}"
            ACR_SERVER="${{ secrets.AZURE_ACR_NAME }}.azurecr.io"
            APP_NAME="aca-ewaste-${TARGET_ENV}-analytics"
            IDENTITY=$(az identity show --name "id-ewaste-${TARGET_ENV}" --resource-group "$RG" --query id -o tsv 2>/dev/null || true)

            # Discover Event Hubs Namespace and Connection String dynamically
            EVH_NAME=$(az eventhubs namespace list --resource-group "$RG" --query "[0].name" -o tsv 2>/dev/null || true)
            if [ -z "$EVH_NAME" ]; then
              EVH_NAME="evh-ewaste-${TARGET_ENV}"
            fi

            BOOTSTRAP_SERVERS="${EVH_NAME}.servicebus.windows.net:9093"
            EVH_CONN_STR=$(az eventhubs namespace authorization-rule keys list \
              --resource-group "$RG" \
              --namespace-name "$EVH_NAME" \
              --name "auth-ewaste-workload" \
              --query primaryConnectionString -o tsv 2>/dev/null || true)

            echo "Deploying Analytics Container App ($APP_NAME) with Bootstrap: $BOOTSTRAP_SERVERS..."

            if az containerapp show --name "$APP_NAME" --resource-group "$RG" >/dev/null 2>&1; then
              echo "Container App $APP_NAME exists. Updating image and environment..."

              if [ -n "$IDENTITY" ]; then
                az containerapp identity assign \
                  --name "$APP_NAME" \
                  --resource-group "$RG" \
                  --user-assigned "$IDENTITY" || true

                az containerapp registry set \
                  --name "$APP_NAME" \
                  --resource-group "$RG" \
                  --server "$ACR_SERVER" \
                  --identity "$IDENTITY" || true
              fi

              az containerapp ingress enable \
                --name "$APP_NAME" \
                --resource-group "$RG" \
                --type external \
                --target-port 8000 || true

              if [ -n "$EVH_CONN_STR" ]; then
                az containerapp secret set \
                  --name "$APP_NAME" \
                  --resource-group "$RG" \
                  --secrets kafka-conn="$EVH_CONN_STR" || true
              fi

              az containerapp update \
                --name "$APP_NAME" \
                --resource-group "$RG" \
                --image "${{ env.ANALYTICS_IMMUTABLE_DIGEST }}" \
                --set-env-vars KAFKA_BOOTSTRAP_SERVERS="$BOOTSTRAP_SERVERS" \
                               KAFKA_CONNECTION_STRING=secretref:kafka-conn \
                               KAFKA_TOPIC_BATCH_EVENTS="ewaste.batch.events" \
                               KAFKA_TOPIC_DLQ="ewaste.batch.events.matching.dlq.v1" \
                               KAFKA_CONSUMER_GROUP="matching-worker" \
                               LOG_LEVEL="INFO"
            else
              echo "Container App $APP_NAME does not exist. Creating new container app with ACR identity..."
              if [ -n "$IDENTITY" ]; then
                az containerapp create \
                  --name "$APP_NAME" \
                  --resource-group "$RG" \
                  --environment "$CAE" \
                  --image "${{ env.ANALYTICS_IMMUTABLE_DIGEST }}" \
                  --target-port 8000 \
                  --ingress external \
                  --min-replicas 1 \
                  --max-replicas 2 \
                  --cpu 0.5 \
                  --memory 1.0Gi \
                  --user-assigned "$IDENTITY" \
                  --registry-server "$ACR_SERVER" \
                  --registry-identity "$IDENTITY" \
                  --secrets kafka-conn="$EVH_CONN_STR" \
                  --env-vars KAFKA_BOOTSTRAP_SERVERS="$BOOTSTRAP_SERVERS" \
                             KAFKA_CONNECTION_STRING=secretref:kafka-conn \
                             KAFKA_TOPIC_BATCH_EVENTS="ewaste.batch.events" \
                             KAFKA_TOPIC_DLQ="ewaste.batch.events.matching.dlq.v1" \
                             KAFKA_CONSUMER_GROUP="matching-worker" \
                             LOG_LEVEL="INFO"
              else
                az containerapp create \
                  --name "$APP_NAME" \
                  --resource-group "$RG" \
                  --environment "$CAE" \
                  --image "${{ env.ANALYTICS_IMMUTABLE_DIGEST }}" \
                  --target-port 8000 \
                  --ingress external \
                  --min-replicas 1 \
                  --max-replicas 2 \
                  --cpu 0.5 \
                  --memory 1.0Gi \
                  --registry-server "$ACR_SERVER" \
                  --secrets kafka-conn="$EVH_CONN_STR" \
                  --env-vars KAFKA_BOOTSTRAP_SERVERS="$BOOTSTRAP_SERVERS" \
                             KAFKA_CONNECTION_STRING=secretref:kafka-conn \
                             KAFKA_TOPIC_BATCH_EVENTS="ewaste.batch.events" \
                             KAFKA_TOPIC_DLQ="ewaste.batch.events.matching.dlq.v1" \
                             KAFKA_CONSUMER_GROUP="matching-worker" \
                             LOG_LEVEL="INFO"
              fi
            fi

            ANALYTICS_FQDN=$(az containerapp show --name "$APP_NAME" --resource-group "$RG" --query "properties.configuration.ingress.fqdn" -o tsv)
            echo "aca_analytics_fqdn=$ANALYTICS_FQDN" >> $GITHUB_OUTPUT
            echo "Analytics Worker deployed at: https://${ANALYTICS_FQDN}"

      # ------------------------------------------------------------------------
      # 1.4 LIVE CONTAINER READINESS PROBES (API, UI & ANALYTICS)
      # ------------------------------------------------------------------------
      - name: Verify Live ACA Health Readiness Probes (API, UI & Analytics)
        run: |
          API_FQDN="${{ steps.api_deploy.outputs.aca_api_fqdn }}"
          UI_FQDN="${{ steps.ui_deploy.outputs.aca_ui_fqdn }}"
          ANALYTICS_FQDN="${{ steps.analytics_deploy.outputs.aca_analytics_fqdn }}"

          if [ -n "$API_FQDN" ]; then
            echo "Verifying API ingress accessibility at: https://$API_FQDN"
            for i in {1..12}; do
              STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://$API_FQDN" || true)
              echo "API Probe Attempt $i/12 (HTTP: $STATUS_CODE)"
              if [ "$STATUS_CODE" != "000" ] && [ "$STATUS_CODE" -lt 500 ]; then
                echo "API verified successfully (HTTP $STATUS_CODE)."
                break
              fi
              sleep 10
            done
          fi

          if [ -n "$UI_FQDN" ]; then
            echo "Verifying UI ingress accessibility at: https://$UI_FQDN"
            for i in {1..12}; do
              STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://$UI_FQDN" || true)
              echo "UI Probe Attempt $i/12 (HTTP: $STATUS_CODE)"
              if [ "$STATUS_CODE" != "000" ] && [ "$STATUS_CODE" -lt 500 ]; then
                echo "UI verified successfully (HTTP $STATUS_CODE)."
                break
              fi
              sleep 10
            done
          fi

          if [ -n "$ANALYTICS_FQDN" ]; then
            echo "Verifying Analytics ingress accessibility at: https://$ANALYTICS_FQDN/healthz"
            for i in {1..12}; do
              STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://$ANALYTICS_FQDN/healthz" || true)
              echo "Analytics Probe Attempt $i/12 (HTTP: $STATUS_CODE)"
              if [ "$STATUS_CODE" == "200" ]; then
                echo "Analytics Worker verified successfully (HTTP 200)."
                break
              fi
              sleep 10
            done
          fi

      # ------------------------------------------------------------------------
      # 1.5 PRUNE OLD ACR IMAGES (Retain Last 3 for Rollback Safety)
      # ------------------------------------------------------------------------
      - name: Prune Stale Container Images in ACR (Keep Last 3)
        if: ${{ inputs.rollback_tag == '' }}
        run: |
          ACR_SERVER="${{ secrets.AZURE_ACR_NAME }}.azurecr.io"
          ACR_NAME=$(echo "$ACR_SERVER" | cut -d'.' -f1)

          for REPO in "${{ env.IMAGE_NAME_API }}" "${{ env.IMAGE_NAME_UI }}" "${{ env.IMAGE_NAME_ANALYTICS }}"; do
            echo "Checking image tags for repository: $REPO"

            # Fetch tags sorted by creation time (newest first), skip top 3, and delete the rest
            TAGS_TO_DELETE=$(az acr repository show-tags \
              --name "$ACR_NAME" \
              --repository "$REPO" \
              --orderby time_desc \
              --output tsv | tail -n +4)

            if [ -n "$TAGS_TO_DELETE" ]; then
              echo "Pruning older tags in $REPO:"
              echo "$TAGS_TO_DELETE"
              for TAG in $TAGS_TO_DELETE; do
                az acr repository delete --name "$ACR_NAME" --image "${REPO}:${TAG}" --yes
              done
            else
              echo "Repository $REPO has 3 or fewer tags. Nothing to prune."
            fi
          done

  # ============================================================================
  # STAGE 2: DYNAMIC APPLICATION SECURITY TESTING (OWASP ZAP)
  # ============================================================================
  dast-security-scan:
    name: OWASP ZAP DAST Scan (${{ needs.resolve-environment.outputs.environment }})
    needs: [resolve-environment, deploy-application]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Execute OWASP ZAP Baseline Scan Against Deployed Service
        if: needs.deploy-application.outputs.aca_api_fqdn != ''
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "https://${{ needs.deploy-application.outputs.aca_api_fqdn }}"
          cmd_options: '-a'
          allow_issue_writing: false
          fail_action: false

      - name: Retain OWASP ZAP DAST Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-dast-${{ needs.resolve-environment.outputs.environment }}-${{ github.sha }}
          path: |
            report_html.html
            report_md.md
            report_json.json
          retention-days: 30

  # ============================================================================
  # STAGE 3: POST-DEPLOYMENT SMOKE & AUDIT VERIFICATION
  # ============================================================================
  smoke-and-audit-verification:
    name: Smoke & Audit Verification (${{ needs.resolve-environment.outputs.environment }})
    needs: [resolve-environment, deploy-application, dast-security-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------------
      # 3.1 BACKEND API AUTHENTICATION SMOKE TEST
      # ------------------------------------------------------------------------
      - name: Execute Seeded-User Login API Smoke Test
        run: |
          API_FQDN="${{ needs.deploy-application.outputs.aca_api_fqdn }}"
          if [ -n "$API_FQDN" ]; then
            API_URL="https://${API_FQDN}/api/v1/auth/login"
            CORRELATION_ID="smoke-api-${{ needs.resolve-environment.outputs.environment }}-$(date +%s)"
            echo "Executing API authentication test with correlation ID: $CORRELATION_ID"

            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$API_URL" \
              -H "Content-Type: application/json" \
              -H "X-Correlation-ID: $CORRELATION_ID" \
              -d '{"username":"admin@ewaste.local","password":"Password123!"}' || true)

            HTTP_BODY=$(echo "$RESPONSE" | sed '$d')
            HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)

            echo "API HTTP Response Status: $HTTP_STATUS"
            echo "API HTTP Response Body: $HTTP_BODY"
          else
            echo "API smoke test skipped: FQDN not yet assigned."
          fi

      # ------------------------------------------------------------------------
      # 3.2 FRONTEND UI ACCESSIBILITY SMOKE TEST
      # ------------------------------------------------------------------------
      - name: Execute Frontend UI Endpoint Smoke Test
        run: |
          UI_FQDN="${{ needs.deploy-application.outputs.aca_ui_fqdn }}"
          if [ -n "$UI_FQDN" ]; then
            UI_URL="https://${UI_FQDN}/"
            echo "Verifying Frontend UI accessibility at: $UI_URL"
            UI_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$UI_URL" || true)
            echo "UI HTTP Response Status: $UI_STATUS"
          else
            echo "UI smoke test skipped: FQDN not yet assigned."
          fi

      # ------------------------------------------------------------------------
      # 3.3 ANALYTICS WORKER & EVENT HUBS INTEGRATION SMOKE TEST
      # ------------------------------------------------------------------------
      - name: Verify Live Kafka Event Publish and Consumer Loop
        run: |
          ANALYTICS_FQDN="${{ needs.deploy-application.outputs.aca_analytics_fqdn }}"
          if [ -n "$ANALYTICS_FQDN" ]; then
            echo "=========================================================="
            echo " Testing Event Hubs Ingress/Egress via Analytics ACA"
            echo " Endpoint: https://${ANALYTICS_FQDN}"
            echo "=========================================================="

            # Step 1: Healthcheck
            echo "1. Probing /healthz..."
            curl -s -f "https://${ANALYTICS_FQDN}/healthz" || (echo "Healthcheck failed" && exit 1)

            # Step 2: Generate unique test batch ID
            TEST_BATCH_ID="test-batch-$(date +%s)"
            echo -e "\n2. Publishing test event with batch_id: $TEST_BATCH_ID..."

            PUB_RESP=$(curl -s -f -X POST "https://${ANALYTICS_FQDN}/api/v1/publish-test" \
              -H "Content-Type: application/json" \
              -d "{\"batch_id\": \"$TEST_BATCH_ID\", \"category\": \"ICT_EQUIPMENT\", \"quantity\": 5, \"zone\": \"NORTH\"}")

            echo "Publish Response: $PUB_RESP"

            # Step 3: Wait for Kafka / Event Hubs delivery to consumer group 'matching-worker'
            echo -e "\n3. Waiting 5 seconds for Event Hubs consumer loop..."
            sleep 5

            # Step 4: Verify that the consumer received the exact event
            echo "4. Checking /api/v1/events for batch_id: $TEST_BATCH_ID..."
            EVENTS_RESP=$(curl -s -f "https://${ANALYTICS_FQDN}/api/v1/events")

            if echo "$EVENTS_RESP" | grep -q "$TEST_BATCH_ID"; then
              echo "SUCCESS: Event with batch_id '$TEST_BATCH_ID' was successfully consumed from Event Hubs!"
            else
              echo "::error::Consumer did not receive event '$TEST_BATCH_ID' within timeout."
              echo "Current events buffer: $EVENTS_RESP"
              exit 1
            fi
          else
            echo "Analytics smoke test skipped: FQDN not yet assigned."
          fi

      # ------------------------------------------------------------------------
      # 3.4 DEPLOYMENT SUMMARY & ARCHIVAL BANNER
      # ------------------------------------------------------------------------
      - name: Confirm Deployment & Archival State
        run: |
          echo "======================================================================"
          echo "  DEPLOYMENT & AUDIT SUITE COMPLETED SUCCESSFULLY"
          echo "  - Environment Target: ${{ needs.resolve-environment.outputs.environment }}"
          echo "  - Deployment Scope: ${{ needs.resolve-environment.outputs.deployment_desc }}"
          echo "  - Database Status: Liquibase Migrations Applied"
          echo "  - Container Release: Multi-Container Verified (API, UI, & Analytics)"
          echo "  - Event Streaming: Azure Event Hubs (Kafka) Integration Tested"
          echo "  - Runtime Health: ACA Ingress Probes Verified (:8080, :3000, :8000)"
          echo "  - DAST Scan: OWASP ZAP Report Retained for Academic Review"
          echo "======================================================================"
