name: CI Quality Gate & Security Baseline

on:
  pull_request:
    branches: [feature/EWCSB-12-login]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read
  id-token: write
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
#  PYTHON_VERSION: "3.14"
  NODE_VERSION: "22"
#  PYTHON_MIN_COVERAGE: "85"

jobs:

  # ============================================================================
  # PHASE 1: CODE QUALITY & SECURITY SCANNING
  # ============================================================================

  # 1.1 PRE-COMMIT / FORMAT CHECKS
  pre-commit-checks:
    name: Pre-Commit Quality & Format Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

#      - name: Setup Python Runtime
#        uses: actions/setup-python@v5
#        with:
#          python-version: ${{ env.PYTHON_VERSION }}
#          cache: pip

      - name: Setup Go Runtime
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Execute Pre-Commit Hooks
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files --show-diff-on-failure


  # 1.2 SECRET DETECTION
  secret-scan:
    name: Gitleaks Secret Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true

  # 1.3 STATIC APPLICATION SECURITY TESTING
  sast-scan:
    name: Semgrep SAST Analysis
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Run Semgrep SAST Scan
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --config p/golang \
            --config p/python \
            --config p/typescript \
            --config p/javascript \
            --sarif \
            --output semgrep.sarif

      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep-sast

      - name: Retain Semgrep Report
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif-${{ github.sha }}
          path: semgrep.sarif
          retention-days: 30

  # 1.4 INFRASTRUCTURE AS CODE SECURITY
  iac-scan:
    name: Checkov IaC Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Check Terraform Directory
        id: terraform-check
        run: |
          if [ -d "terraform" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Terraform directory does not exist yet."
          fi

      - name: Run Checkov
        if: steps.terraform-check.outputs.exists == 'true'
        uses: bridgecrewio/checkov-action@v12.1347.0
        with:
          directory: terraform/
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          soft_fail: false

      - name: Terraform Baseline Message
        if: steps.terraform-check.outputs.exists == 'false'
        run: |
          echo "Terraform implementation is not available yet."
          echo "Checkov will scan terraform/ once infrastructure code is added."

      - name: Upload Checkov SARIF
        if: always() && steps.terraform-check.outputs.exists == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov.sarif
          category: checkov-iac

      - name: Retain Checkov Report
        if: always() && steps.terraform-check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: checkov-sarif-${{ github.sha }}
          path: checkov.sarif
          retention-days: 30


  # ============================================================================
  # PHASE 2: EXPLICIT SECURITY GATE
  # ============================================================================

  security-gate:
    name: Security Gate
    needs:
      - secret-scan
      - sast-scan
      - iac-scan

    runs-on: ubuntu-latest

    steps:
      - name: Confirm Security Checks Passed
        run: |
          echo "=============================================="
          echo "           SECURITY GATE PASSED"
          echo "=============================================="
          echo "Gitleaks : PASSED"
          echo "Semgrep  : PASSED"
          echo "Checkov  : PASSED"
          echo "=============================================="
          echo "Required security checks completed."
          echo "Downstream CI stages may proceed."
          echo "=============================================="


  # ============================================================================
  # PHASE 3: AUTOMATED UNIT VERIFICATION
  # ============================================================================

  # 3.1 GO BACKEND
  backend-tests:
    name: Backend Unit Tests (Go)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Check Go Project
        id: go-check
        run: |
          if [ -f "src/backend/go.mod" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Go Runtime
        if: steps.go-check.outputs.exists == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run Backend Tests
        if: steps.go-check.outputs.exists == 'true'
        working-directory: src/backend
        run: |
          go test -v \
            -race \
            -covermode=atomic \
            -coverprofile=coverage.out \
            ./...

      - name: Backend Not Available Yet
        if: steps.go-check.outputs.exists == 'false'
        run: |
          echo "No Go application available yet."
          echo "Backend tests will run when src/backend/go.mod exists."

      - name: Upload Go Coverage
        if: steps.go-check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-${{ github.sha }}
          path: src/backend/coverage.out
          retention-days: 30


  # 3.2 PYTHON ANALYTICS
  analytics-tests:
    name: Analytics Unit Tests (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Check Analytics Project
        id: python-check
        run: |
          if [ -d "src/analytics" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python Runtime
        if: steps.python-check.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Test Dependencies
        if: steps.python-check.outputs.exists == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Run PyTest
        if: steps.python-check.outputs.exists == 'true'
        working-directory: src/analytics
        run: |
          pytest -v \
            --cov=. \
            --cov-report=term \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=${{ env.PYTHON_MIN_COVERAGE }} \
            --junitxml=junit.xml

      - name: Analytics Not Available Yet
        if: steps.python-check.outputs.exists == 'false'
        run: |
          echo "No Python analytics implementation available yet."
          echo "Analytics tests will run when src/analytics exists."

      - name: Upload Python Test Evidence
        if: steps.python-check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: analytics-test-results-${{ github.sha }}
          path: |
            src/analytics/junit.xml
            src/analytics/coverage.xml
          retention-days: 30


  # 3.3 NEXT.JS FRONTEND
  frontend-checks:
    name: Frontend Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Check Frontend Project
        id: frontend-check
        run: |
          if [ -f "src/frontend/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js Runtime
        if: steps.frontend-check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install Frontend Dependencies
        if: steps.frontend-check.outputs.exists == 'true'
        working-directory: src/frontend
        run: npm ci

      - name: Run Frontend Lint
        if: steps.frontend-check.outputs.exists == 'true'
        working-directory: src/frontend
        run: npm run lint --if-present

      - name: Run Frontend Tests
        if: steps.frontend-check.outputs.exists == 'true'
        working-directory: src/frontend
        run: npm test -- --coverage --watchAll=false

      - name: Frontend Not Available Yet
        if: steps.frontend-check.outputs.exists == 'false'
        run: |
          echo "No frontend application available yet."
          echo "Frontend checks will run when src/frontend/package.json exists."


  # ============================================================================
  # PHASE 4: CONTAINER PACKAGING & VULNERABILITY AUDIT
  # ============================================================================

  container-security:
    name: Container Build, SBOM & Vulnerability Scan

    needs:
      - security-gate
      - pre-commit-checks
      - backend-tests
      - analytics-tests
      - frontend-checks

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Build Application Container
        run: |
          if [ -f "src/backend/Dockerfile" ]; then

            docker build \
              -t ewaste-platform:${{ github.sha }} \
              -f src/backend/Dockerfile \
              src/backend/

          else

            echo "Application Dockerfile not available yet."
            echo "Building temporary security baseline image."

            docker build \
              -t ewaste-platform:${{ github.sha }} \
              - <<'EOF'

          FROM alpine:3.19

          RUN addgroup -S appgroup && \
              adduser -S appuser -G appgroup

          USER appuser

          CMD ["echo", "E-Waste Platform Security Baseline"]

          EOF

          fi


      # SBOM GENERATION
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: ewaste-platform:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json


      # CONTAINER VULNERABILITY SCANNING
      - name: Scan Container with Grype
        uses: anchore/scan-action@v3
        with:
          image: ewaste-platform:${{ github.sha }}
          fail-build: true
          severity-cutoff: critical


      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.spdx.json
          retention-days: 30

  # ============================================================================
  # PHASE 5: COSIGN TOOLING CHECK
  #
  # Actual image signing is performed later in the CD/release pipeline after
  # the approved image has been pushed to ACR and an immutable digest exists.
  # ============================================================================

  supply-chain-tooling-check:
    name: Cosign Availability & Configuration Check
    needs:
      - container-security

    runs-on: ubuntu-latest

    steps:
      - name: Install Cosign CLI
        uses: sigstore/cosign-installer@v3

      - name: Verify Cosign Installation
        run: |
          echo "=== Cosign Supply Chain Security ==="
          cosign version

      - name: Verify Cosign Configuration
        run: |
          if [ -n "${{ secrets.COSIGN_PRIVATE_KEY }}" ]; then
            echo "COSIGN_PRIVATE_KEY secret detected."
            echo "Cosign signing prerequisites are configured for CD."
          else
            echo "COSIGN_PRIVATE_KEY secret is not configured."
            echo "Actual image signing will require CD configuration."
          fi

      - name: Confirm CI Pipeline Completion
        run: |
          echo "=============================================="
          echo "       CI SECURITY PIPELINE COMPLETE"
          echo "=============================================="
          echo "Pre-Commit : PASSED"
          echo "Gitleaks   : PASSED"
          echo "Semgrep    : PASSED"
          echo "Checkov    : PASSED"
          echo "Unit Tests : COMPLETED"
          echo "Syft SBOM  : GENERATED"
          echo "Grype      : PASSED"
          echo "Cosign     : TOOLING READY"
          echo "=============================================="
          echo "Actual image signing and verification will"
          echo "be performed in the CD/release workflow."
          echo "=============================================="
