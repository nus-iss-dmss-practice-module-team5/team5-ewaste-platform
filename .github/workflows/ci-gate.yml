name: CI Quality Gate & Security Baseline

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened]

  push:
    branches: [dev, main, feature/EWCSB-137-security-hardening]

permissions:
  contents: read
  pull-requests: read
  id-token: write
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"

jobs:

  # ============================================================================
  # PHASE 1: CODE QUALITY & SECURITY SCANNING
  # ============================================================================

  # 1.1 PRE-COMMIT / FORMAT CHECKS
  pre-commit-checks:
    name: Pre-Commit Quality & Format Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Go Runtime
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: src/backend/go.sum

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Execute Pre-Commit Hooks
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files --show-diff-on-failure


  # 1.2 SECRET DETECTION
  secret-scan:
    name: Gitleaks Secret Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract Current PR Changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "=============================================="
          echo "       GITLEAKS PR SECURITY SCAN"
          echo "=============================================="
          echo "Base commit: $BASE_SHA"
          echo "Head commit: $HEAD_SHA"
          echo ""
          echo "Extracting ONLY added lines from this PR..."

          mkdir -p gitleaks-pr

          git diff --unified=0 "$BASE_SHA" "$HEAD_SHA" -- . \
            | awk '/^\+[^+]/ {sub(/^\+/, ""); print}' \
            > gitleaks-pr/pr-added-lines.txt

          echo ""
          echo "Lines extracted:"
          wc -l gitleaks-pr/pr-added-lines.txt

      - name: Run Gitleaks on Current PR
        if: github.event_name == 'pull_request'
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        with:
          args: >
            dir /github/workspace/gitleaks-pr
            --redact
            --exit-code 1
            --report-format sarif
            --report-path /github/workspace/gitleaks-results.sarif
            --log-level info

      - name: Run Gitleaks on Push to Dev/Main
        if: github.event_name == 'push'
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        with:
          args: >
            dir /github/workspace
            --redact
            --exit-code 1
            --report-format sarif
            --report-path /github/workspace/gitleaks-results.sarif
            --log-level info

      - name: Upload Gitleaks Report
        if: always() && hashFiles('gitleaks-results.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results-${{ github.sha }}
          path: gitleaks-results.sarif
          retention-days: 30
  # 1.3 STATIC APPLICATION SECURITY TESTING
  sast-scan:
    name: Semgrep SAST Analysis
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Run Semgrep SAST Scan
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --config p/golang \
            --config p/python \
            --config p/typescript \
            --config p/javascript \
            --sarif \
            --output semgrep.sarif \
            --error

      - name: Retain Semgrep Report
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif-${{ github.sha }}
          path: semgrep.sarif
          retention-days: 30

  # 1.4 INFRASTRUCTURE AS CODE SECURITY
  iac-scan:
    name: Checkov IaC Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Check Terraform Directory
        id: terraform-check
        run: |
          if [ -d "terraform" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Terraform directory does not exist yet."
          fi

      - name: Run Checkov
        if: steps.terraform-check.outputs.exists == 'true'
        uses: bridgecrewio/checkov-action@v12.1347.0
        with:
          directory: terraform/
          framework: terraform
          output_format: cli
          soft_fail: false
          log_level: WARNING
          container_user: 0

      - name: Terraform Baseline Message
        if: steps.terraform-check.outputs.exists == 'false'
        run: |
          echo "Terraform implementation is not available yet."
          echo "Checkov will scan terraform/ once infrastructure code is added."





  # ============================================================================
  # PHASE 3: AUTOMATED UNIT VERIFICATION
  # ============================================================================

  # 3.1 GO BACKEND
  backend-tests:
    name: Backend Unit Tests (Go)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Check Go Project
        id: go-check
        run: |
          if [ -f "src/backend/go.mod" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Go Runtime
        if: steps.go-check.outputs.exists == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run Backend Tests
        if: steps.go-check.outputs.exists == 'true'
        working-directory: src/backend
        run: |
          go test -v \
            -race \
            -covermode=atomic \
            -coverprofile=coverage.out \
            ./...

      - name: Backend Not Available Yet
        if: steps.go-check.outputs.exists == 'false'
        run: |
          echo "No Go application available yet."
          echo "Backend tests will run when src/backend/go.mod exists."

      - name: Upload Go Coverage
        if: steps.go-check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-${{ github.sha }}
          path: src/backend/coverage.out
          retention-days: 30


  # 3.2 PYTHON ANALYTICS
  analytics-tests:
    name: Analytics Unit Tests (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Check Analytics Project
        id: python-check
        run: |
          if [ -d "src/analytics" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python Runtime
        if: steps.python-check.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Test Dependencies
        if: steps.python-check.outputs.exists == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Run PyTest
        if: steps.python-check.outputs.exists == 'true'
        working-directory: src/analytics
        run: |
          pytest -v \
            --cov=. \
            --cov-report=term \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=${{ env.PYTHON_MIN_COVERAGE }} \
            --junitxml=junit.xml

      - name: Analytics Not Available Yet
        if: steps.python-check.outputs.exists == 'false'
        run: |
          echo "No Python analytics implementation available yet."
          echo "Analytics tests will run when src/analytics exists."

      - name: Upload Python Test Evidence
        if: steps.python-check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: analytics-test-results-${{ github.sha }}
          path: |
            src/analytics/junit.xml
            src/analytics/coverage.xml
          retention-days: 30


  # 3.3 NEXT.JS FRONTEND
  frontend-checks:
    name: Frontend Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Check Frontend Project
        id: frontend-check
        run: |
          if [ -f "src/frontend/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js Runtime
        if: steps.frontend-check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install Frontend Dependencies
        if: steps.frontend-check.outputs.exists == 'true'
        working-directory: src/frontend
        run: npm ci

      - name: Run Frontend Lint
        if: steps.frontend-check.outputs.exists == 'true'
        working-directory: src/frontend
        run: npm run lint --if-present

      - name: Run Frontend Tests
        if: steps.frontend-check.outputs.exists == 'true'
        working-directory: src/frontend
        run: npm test -- --coverage --watchAll=false

      - name: Frontend Not Available Yet
        if: steps.frontend-check.outputs.exists == 'false'
        run: |
          echo "No frontend application available yet."
          echo "Frontend checks will run when src/frontend/package.json exists."


  # ============================================================================
  # PHASE 4: CONTAINER PACKAGING & VULNERABILITY AUDIT
  # ============================================================================

  container-security:
    name: Container Build, SBOM & Vulnerability Scan

    needs:
      - backend-tests
      - analytics-tests
      - frontend-checks

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Build Application Container
        run: |
          if [ -f "src/backend/Dockerfile" ]; then

            docker build \
              -t ewaste-platform:${{ github.sha }} \
              -f src/backend/Dockerfile \
              src/backend/

          else

            echo "Application Dockerfile not available yet."
            echo "Building temporary security baseline image."

            docker build \
              -t ewaste-platform:${{ github.sha }} \
              - <<'EOF'

          FROM alpine:3.19

          RUN addgroup -S appgroup && \
              adduser -S appuser -G appgroup

          USER appuser

          CMD ["echo", "E-Waste Platform Security Baseline"]

          EOF

          fi


      # SBOM GENERATION
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: ewaste-platform:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json


      # CONTAINER VULNERABILITY SCANNING
      - name: Scan Container with Grype
        id: grype-scan
        uses: anchore/scan-action@v7
        with:
          image: ewaste-platform:${{ github.sha }}
          fail-build: true
          severity-cutoff: critical
          cache-db: false
          output-format: sarif

      # RETAIN GRYPE VULNERABILITY REPORT
      - name: Upload Grype Vulnerability Report
        if: always() && steps.grype-scan.outputs.sarif != ''
        uses: actions/upload-artifact@v4
        with:
          name: grype-vulnerability-report-${{ github.sha }}
          path: ${{ steps.grype-scan.outputs.sarif }}
          retention-days: 30

      # RETAIN SBOM
      - name: Upload SBOM
        if: always() && hashFiles('sbom.spdx.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.spdx.json
          retention-days: 30

  # ============================================================================
  # PHASE 5: COSIGN TOOLING CHECK
  #
  # Actual image signing is performed later in the CD/release pipeline after
  # the approved image has been pushed to ACR and an immutable digest exists.
  # ============================================================================

  supply-chain-tooling-check:
    name: Cosign Availability & Configuration Check
    needs:
      - secret-scan
      - sast-scan
      - iac-scan
      - container-security

    runs-on: ubuntu-latest

    steps:
      - name: Install Cosign CLI
        uses: sigstore/cosign-installer@v3

      - name: Verify Cosign Installation
        run: |
          echo "=== Cosign Supply Chain Security ==="
          cosign version

      - name: Verify Cosign Configuration
        run: |
          if [ -n "${{ secrets.COSIGN_PRIVATE_KEY }}" ]; then
            echo "COSIGN_PRIVATE_KEY secret detected."
            echo "Cosign signing prerequisites are configured for CD."
          else
            echo "COSIGN_PRIVATE_KEY secret is not configured."
            echo "Actual image signing will require CD configuration."
          fi

      - name: Confirm CI Pipeline Completion
        run: |
          echo "=============================================="
          echo "       CI SECURITY PIPELINE COMPLETE"
          echo "=============================================="

          echo "Gitleaks   : PASSED"
          echo "Semgrep    : PASSED"
          echo "Checkov    : PASSED"
          echo "Unit Tests : COMPLETED"
          echo "Syft SBOM  : GENERATED"
          echo "Grype      : PASSED"
          echo "Cosign     : TOOLING READY"
          echo "=============================================="
          echo "Actual image signing and verification will"
          echo "be performed in the CD/release workflow."
          echo "=============================================="
