name: Matching and Analytics Contracts, Kafka and MySQL Persistence

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matcher:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify matching and analytics against disposable Go, MySQL and Kafka services
        run: ./scripts/test-matcher.sh
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matcher-persistence-evidence
          path: artifacts/matcher/
          retention-days: 14
