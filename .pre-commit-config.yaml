# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  # ============================================================================
  # GENERAL REPOSITORY & HYGIENE CHECKS
  # ============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--allow-multiple-documents']
        exclude: ^(\.github/|terraform/)
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: debug-statements
      - id: detect-private-key

  # ============================================================================
  # PYTHON / ANALYTICS CHECKS (Formatting, Imports, Linting)
  # ============================================================================
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        language_version: python3
        files: ^(src/analytics/|scripts/)

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        files: ^(src/analytics/|scripts/)

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        files: ^(src/analytics/|scripts/)
        args: ['--max-line-length=100', '--extend-ignore=E203,W503']

  # ============================================================================
  # GO / API CODE CHECKS (Formatting & Linting)
  # ============================================================================
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
        files: ^src/backend/
      - id: go-vet
        files: ^src/backend/

  # ============================================================================
  # FRONTEND / UI CODE CHECKS (Prettier for TS, TSX, JS, CSS)
  # ============================================================================
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, css, scss, json, markdown]
        files: ^(src/frontend/|docs/)