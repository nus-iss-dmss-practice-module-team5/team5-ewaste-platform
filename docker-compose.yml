services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ewaste}
      MYSQL_USER: ${MYSQL_USER:-ewaste_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - ewaste_internal

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - ewaste_internal

  workflow-api:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      EWASTE_MODE: ${EWASTE_MODE:-production}
      EWASTE_SERVER_PORT: ":8080"
      EWASTE_DATABASE_DSN: ${EWASTE_DATABASE_DSN:?EWASTE_DATABASE_DSN must be set}
      EWASTE_REDIS_ADDRESS: redis:6379
      EWASTE_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      EWASTE_REDIS_DB: ${EWASTE_REDIS_DB:-0}
      EWASTE_AUTH_ISSUER: ${EWASTE_AUTH_ISSUER:-ewaste-workflow-api}
      EWASTE_AUTH_ACCESS_SECRET: ${EWASTE_AUTH_ACCESS_SECRET:?EWASTE_AUTH_ACCESS_SECRET must be set}
      EWASTE_AUTH_REFRESH_SECRET: ${EWASTE_AUTH_REFRESH_SECRET:?EWASTE_AUTH_REFRESH_SECRET must be set}
      EWASTE_AUTH_REFRESH_HASH_SECRET: ${EWASTE_AUTH_REFRESH_HASH_SECRET:?EWASTE_AUTH_REFRESH_HASH_SECRET must be set}
      EWASTE_AUTH_ACCESS_TTL: ${EWASTE_AUTH_ACCESS_TTL:-15m}
      EWASTE_AUTH_REFRESH_TTL: ${EWASTE_AUTH_REFRESH_TTL:-24h}
      EWASTE_RATE_LIMIT_REQUESTS: ${EWASTE_RATE_LIMIT_REQUESTS:-10}
      EWASTE_RATE_LIMIT_WINDOW: ${EWASTE_RATE_LIMIT_WINDOW:-1m}
      EWASTE_LOGGING_LEVEL: ${EWASTE_LOGGING_LEVEL:-info}
      EWASTE_LOGGING_FILE_PATH: /app/logs/workflow-api.log
      EWASTE_LOGGING_MAX_SIZE_MB: ${EWASTE_LOGGING_MAX_SIZE_MB:-10}
      EWASTE_LOGGING_MAX_BACKUPS: ${EWASTE_LOGGING_MAX_BACKUPS:-5}
      EWASTE_LOGGING_MAX_AGE_DAYS: ${EWASTE_LOGGING_MAX_AGE_DAYS:-30}
      EWASTE_LOGGING_COMPRESS: ${EWASTE_LOGGING_COMPRESS:-true}
      EWASTE_LOGGING_CONSOLE: ${EWASTE_LOGGING_CONSOLE:-true}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:8080/api/v1/hello || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - ewaste_internal

volumes:
  mysql_data:
  redis_data:

networks:
  ewaste_internal:
    driver: bridge
