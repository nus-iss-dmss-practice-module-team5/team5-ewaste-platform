# SonarQube analysis for the e-waste platform (EWCSB-118).
# Run by the sonarqube-analysis job in .github/workflows/ci-gate.yml.

sonar.projectKey=team5-ewaste-platform
sonar.projectName=Team5 E-Waste Platform
sonar.sourceEncoding=UTF-8

# Application code: Go API, Next.js UI, Python matcher/analytics worker,
# plus Terraform for infrastructure-as-code rules.
sonar.sources=src/backend,src/frontend/src,src/matcher/matcher,terraform
sonar.tests=src/backend,src/frontend/src,src/matcher/tests

sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  **/coverage/**,\
  **/*_test.go,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/test/**,\
  **/testdata/**,\
  **/vendor/**,\
  **/.terraform/**,\
  src/backend/docs/**

sonar.test.inclusions=\
  **/*_test.go,\
  **/*.test.ts,\
  **/*.test.tsx,\
  src/matcher/tests/**

# Coverage produced by the existing test jobs in the same CI run.
sonar.go.coverage.reportPaths=coverage/backend/coverage.out
sonar.javascript.lcov.reportPaths=coverage/frontend/lcov.info
sonar.python.coverage.reportPaths=coverage/matcher/coverage.xml
sonar.python.version=3.11,3.12

# Generated or entry-point code that unit tests are not expected to cover.
sonar.coverage.exclusions=\
  src/backend/cmd/**,\
  src/frontend/src/app/**/layout.tsx,\
  terraform/**
