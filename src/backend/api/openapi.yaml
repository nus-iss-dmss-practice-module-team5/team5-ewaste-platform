openapi: 3.0.3
info:
  title: E-Waste Workflow API
  version: 2.0.0
  description: Sprint 1 authentication/health and Sprint 2 donor-to-handoff workflow contract.
servers:
  - url: http://localhost:8080
    description: Local development and test server
tags:
  - name: Health
  - name: Test
  - name: Authentication
  - name: Batches
  - name: Opportunities
  - name: Assignments
paths:
  /healthz:
    get:
      tags: [Health]
      summary: Check whether the process is alive
      operationId: livenessCheck
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
              example:
                status: ok
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
  /readyz:
    get:
      tags: [Health]
      summary: Check whether required dependencies are available
      operationId: readinessCheck
      responses:
        '200':
          description: MySQL and Redis are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
              example:
                status: ready
                mysql: ok
                redis: ok
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '503':
          description: MySQL or Redis is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
              example:
                status: not_ready
                mysql: unavailable
                redis: ok
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
  /api/v1/hello:
    get:
      tags: [Test]
      summary: Return the test Hello World response
      operationId: helloWorld
      responses:
        '200':
          description: Hello World response
          content:
            application/json:
              schema:
                type: object
                required: [msg]
                properties:
                  msg: {type: string}
              example:
                msg: hello world
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate a user and create an active session
      operationId: login
      security: []
      description: Invalid, unknown, and disabled credentials return the same generic error.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: donor1@ewaste.test
              password: example-password
      responses:
        '200':
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/InvalidCredentials'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      summary: Rotate the access and refresh JWT pair
      operationId: refresh
      security: []
      description: The refresh JWT is sent in JSON and is rotated after successful use.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token pair rotated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/InvalidSession'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current authenticated session
      operationId: logout
      description: Requires an active access JWT. No request body is required.
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '204':
          description: Session revoked successfully
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '401': {$ref: '#/components/responses/InvalidSession'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/batches:
    get:
      tags: [Batches]
      summary: List batches visible to the authenticated actor
      operationId: listBatches
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/CorrelationId'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [DRAFT, SUBMITTED, MATCHED, APPROVED, ASSIGNED, COLLECTED, FAILED_COLLECTION]
        - name: page
          in: query
          required: false
          schema: {type: integer, minimum: 1, default: 1}
        - name: page_size
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: Scoped paginated batch list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchListResponse'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '401': {$ref: '#/components/responses/InvalidSession'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    post:
      tags: [Batches]
      summary: Create a donor batch draft
      operationId: createBatchDraft
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchDraftRequest'
            example:
              category: laptops
              quantity: 10
              estimated_weight_kg: 25.50
              condition_rating: reusable
              is_data_bearing: true
              zone: central
              collection_deadline: '2026-09-23T02:00:00.000000Z'
              notes: Stored in the loading bay.
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchMutationResponse'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/InvalidSession'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/batches/{batch_id}:
    parameters:
      - $ref: '#/components/parameters/BatchId'
    get:
      tags: [Batches]
      summary: Get one scoped batch
      operationId: getBatch
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Batch detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchMutationResponse'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '401': {$ref: '#/components/responses/InvalidSession'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Batches]
      summary: Edit a donor-owned draft batch
      operationId: editBatchDraft
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatchVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchDraftRequest'
      responses:
        '200':
          description: Draft updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchMutationResponse'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '401': {$ref: '#/components/responses/InvalidSession'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/batches/{batch_id}/submit:
    post:
      tags: [Batches]
      summary: Validate and submit a donor draft
      operationId: submitBatch
      parameters:
        - $ref: '#/components/parameters/BatchId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatchVersion'
      responses:
        '200':
          description: Batch submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchMutationResponse'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '401': {$ref: '#/components/responses/InvalidSession'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/opportunities:
    get:
      tags: [Opportunities]
      summary: List eligible matching opportunities
      operationId: listOpportunities
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/CorrelationId'
        - name: page
          in: query
          required: false
          schema: {type: integer, minimum: 1, default: 1}
        - name: page_size
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: Scoped eligible opportunities, or an empty list while matching is in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityListResponse'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '401': {$ref: '#/components/responses/InvalidSession'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/opportunities/{batch_id}:
    parameters:
      - $ref: '#/components/parameters/BatchId'
    get:
      tags: [Opportunities]
      summary: Get one eligible matching opportunity
      operationId: getOpportunity
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Opportunity detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityResponse'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '401': {$ref: '#/components/responses/InvalidSession'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/batches/{batch_id}/claim:
    post:
      tags: [Opportunities]
      summary: Claim one eligible opportunity using FCFS transaction controls
      operationId: claimOpportunity
      parameters:
        - $ref: '#/components/parameters/BatchId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatchVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimRequest'
            example:
              expected_version: 3
              claim_epoch: '1'
              notes: Ready for collection.
      responses:
        '200':
          description: Claim confirmed and batch approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponse'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '401': {$ref: '#/components/responses/InvalidSession'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/batches/{batch_id}/assignments:
    post:
      tags: [Assignments]
      summary: Select an approved batch and create an accepted assignment
      operationId: selectAssignment
      parameters:
        - $ref: '#/components/parameters/BatchId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatchVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentSelectionRequest'
            example:
              expected_version: 4
              claim_epoch: '1'
              collector_scope_id: 9f6d5c3a-37e1-4e0e-a5f6-0f7f4e2b2c99
      responses:
        '201':
          description: Assignment created and batch assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentMutationResponse'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '401': {$ref: '#/components/responses/InvalidSession'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/assignments:
    get:
      tags: [Assignments]
      summary: List assignments visible to the authenticated collector
      operationId: listAssignments
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/CorrelationId'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ACCEPTED, COMPLETED, FAILED, SUPERSEDED]
        - name: page
          in: query
          required: false
          schema: {type: integer, minimum: 1, default: 1}
        - name: page_size
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: Scoped assignment list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentListResponse'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '401': {$ref: '#/components/responses/InvalidSession'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/assignments/{assignment_id}:
    parameters:
      - $ref: '#/components/parameters/AssignmentId'
    get:
      tags: [Assignments]
      summary: Get one scoped assignment
      operationId: getAssignment
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Assignment detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentMutationResponse'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '401': {$ref: '#/components/responses/InvalidSession'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/assignments/{assignment_id}/accept:
    post:
      tags: [Assignments]
      summary: Accept an assignment (legacy compatibility command)
      operationId: acceptAssignment
      deprecated: true
      description: New selection creates an ACCEPTED assignment. This endpoint remains for the legacy UI contract only.
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatchVersion'
      responses:
        '200':
          description: Assignment accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentMutationResponse'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '401': {$ref: '#/components/responses/InvalidSession'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/assignments/{assignment_id}/reject:
    post:
      tags: [Assignments]
      summary: Reject an assignment before pickup
      operationId: rejectAssignment
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatchVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectAssignmentRequest'
            example:
              rejection_reason: route_unavailable
      responses:
        '200':
          description: Assignment rejected and batch returned to APPROVED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentMutationResponse'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '401': {$ref: '#/components/responses/InvalidSession'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/assignments/{assignment_id}/handoff:
    post:
      tags: [Assignments]
      summary: Record a successful collection handoff
      operationId: recordCollectionHandoff
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatchVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandoffRequest'
            example:
              pickup_occurred_at: '2026-09-19T02:00:00.000000Z'
              donor_representative_name: Representative
              actual_item_count: 10
              verification_hash: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
              notes: Items received.
      responses:
        '200':
          description: Handoff recorded and batch collected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentMutationResponse'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '401': {$ref: '#/components/responses/InvalidSession'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/assignments/{assignment_id}/fail:
    post:
      tags: [Assignments]
      summary: Report a failed pickup
      operationId: reportFailedPickup
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatchVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FailedPickupRequest'
            example:
              failure_reason: collector_absent
              observed_details: No authorised recipient was present.
      responses:
        '200':
          description: Failed pickup recorded and assignment closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentMutationResponse'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '401': {$ref: '#/components/responses/InvalidSession'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
components:
  parameters:
    Authorization:
      name: Authorization
      in: header
      required: true
      description: Access token using the Bearer scheme.
      schema: {type: string}
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: Client correlation ID; generated by the server when omitted.
      schema: {type: string, minLength: 1, maxLength: 128}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable command identity reused for safe retries.
      schema: {type: string, minLength: 1, maxLength: 128}
    IfMatchVersion:
      name: If-Match-Version
      in: header
      required: true
      description: Expected locked aggregate version for a mutating command.
      schema: {type: integer, minimum: 1}
    BatchId:
      name: batch_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    AssignmentId:
      name: assignment_id
      in: path
      required: true
      schema: {type: string, format: uuid}
  headers:
    CorrelationId:
      description: Correlation ID for tracing the request.
      schema: {type: string, minLength: 1, maxLength: 128}
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, format: password, minLength: 1}
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: {type: string, minLength: 1}
    TokenResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, refresh_expires_in]
      properties:
        access_token:
          type: string
          description: Short-lived access JWT for protected APIs.
        refresh_token:
          type: string
          description: Longer-lived refresh JWT accepted only by /auth/refresh.
        token_type: {type: string, enum: [Bearer]}
        expires_in:
          type: integer
          format: int64
          minimum: 1
          description: Access-token lifetime in seconds.
        refresh_expires_in:
          type: integer
          format: int64
          minimum: 1
          description: Refresh-token lifetime in seconds.
    BatchDraftRequest:
      type: object
      additionalProperties: false
      properties:
        category: {type: string, maxLength: 100}
        quantity: {type: integer, minimum: 1, maximum: 100000}
        estimated_weight_kg: {type: number, format: double, minimum: 0.1}
        condition_rating: {type: string, maxLength: 50}
        is_data_bearing: {type: boolean, default: false}
        zone: {type: string, maxLength: 100}
        collection_deadline: {type: string, format: date-time}
        notes: {type: string, maxLength: 500}
    Batch:
      type: object
      required: [batch_id, status, version]
      properties:
        batch_id: {type: string, format: uuid}
        status:
          type: string
          enum: [DRAFT, SUBMITTED, MATCHED, APPROVED, ASSIGNED, COLLECTED, FAILED_COLLECTION]
        version: {type: integer, minimum: 1}
        category: {type: string}
        quantity: {type: integer, minimum: 1}
        estimated_weight_kg: {type: number, format: double}
        condition_rating: {type: string}
        is_data_bearing: {type: boolean}
        zone: {type: string}
        collection_deadline: {type: string, format: date-time}
        notes: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    BatchMutationResponse:
      type: object
      required: [data, correlation_id]
      properties:
        data: {$ref: '#/components/schemas/Batch'}
        correlation_id: {type: string}
        event_id: {type: string, format: uuid}
        event_state: {type: string, enum: [PENDING, PUBLISHED]}
    BatchListResponse:
      type: object
      required: [data, page, page_size, total_count, correlation_id]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/Batch'}
        page: {type: integer, minimum: 1}
        page_size: {type: integer, minimum: 1}
        total_count: {type: integer, minimum: 0}
        correlation_id: {type: string}
    Opportunity:
      type: object
      required: [batch_id, status, category, quantity, zone, collection_deadline, eligibility_reason]
      properties:
        batch_id: {type: string, format: uuid}
        status: {type: string, enum: [MATCHED, APPROVED, ASSIGNED]}
        category: {type: string}
        quantity: {type: integer, minimum: 1}
        estimated_weight_kg: {type: number, format: double}
        zone: {type: string}
        collection_deadline: {type: string, format: date-time}
        eligibility_reason: {type: string}
    OpportunityResponse:
      type: object
      required: [data, correlation_id]
      properties:
        data: {$ref: '#/components/schemas/Opportunity'}
        correlation_id: {type: string}
    OpportunityListResponse:
      type: object
      required: [data, page, page_size, total_count, correlation_id]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/Opportunity'}
        page: {type: integer, minimum: 1}
        page_size: {type: integer, minimum: 1}
        total_count: {type: integer, minimum: 0}
        correlation_id: {type: string}
    ClaimRequest:
      type: object
      required: [expected_version, claim_epoch]
      additionalProperties: false
      properties:
        expected_version: {type: integer, minimum: 1}
        claim_epoch: {type: string, pattern: '^[0-9]+$'}
        notes: {type: string, maxLength: 255}
    ClaimResult:
      type: object
      required: [batch_id, status, version, claim_epoch, claim_id, reservation_id, event_id, event_state, correlation_id]
      properties:
        batch_id: {type: string, format: uuid}
        status: {type: string, enum: [APPROVED]}
        version: {type: integer, minimum: 1}
        claim_epoch: {type: string, pattern: '^[0-9]+$'}
        claim_id: {type: string, format: uuid}
        reservation_id: {type: string, format: uuid}
        event_id: {type: string, format: uuid}
        event_state: {type: string, enum: [PENDING, PUBLISHED]}
        correlation_id: {type: string}
    ClaimResponse:
      type: object
      required: [data, correlation_id]
      properties:
        data: {$ref: '#/components/schemas/ClaimResult'}
        correlation_id: {type: string}
    AssignmentSelectionRequest:
      type: object
      required: [expected_version, claim_epoch, collector_scope_id]
      additionalProperties: false
      properties:
        expected_version: {type: integer, minimum: 1}
        claim_epoch: {type: string, pattern: '^[0-9]+$'}
        collector_scope_id: {type: string, format: uuid}
    RejectAssignmentRequest:
      type: object
      required: [rejection_reason]
      additionalProperties: false
      properties:
        rejection_reason: {type: string, maxLength: 100}
    HandoffRequest:
      type: object
      required: [pickup_occurred_at, donor_representative_name, actual_item_count, verification_hash]
      additionalProperties: false
      properties:
        pickup_occurred_at: {type: string, format: date-time}
        donor_representative_name: {type: string, maxLength: 150}
        actual_item_count: {type: integer, minimum: 0}
        verification_hash: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
        notes: {type: string, maxLength: 500}
    FailedPickupRequest:
      type: object
      required: [failure_reason]
      additionalProperties: false
      properties:
        failure_reason: {type: string, maxLength: 100}
        observed_details: {type: string, maxLength: 500}
    Assignment:
      type: object
      required: [assignment_id, batch_id, assignment_status, assignment_sequence, version]
      properties:
        assignment_id: {type: string, format: uuid}
        batch_id: {type: string, format: uuid}
        claim_id: {type: string, format: uuid}
        collector_user_id: {type: string, format: uuid}
        collector_scope_id: {type: string, format: uuid}
        assignment_status: {type: string, enum: [ACCEPTED, COMPLETED, FAILED, SUPERSEDED]}
        assignment_sequence: {type: integer, minimum: 1}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AssignmentMutationResponse:
      type: object
      required: [data, correlation_id]
      properties:
        data: {$ref: '#/components/schemas/Assignment'}
        correlation_id: {type: string}
        event_id: {type: string, format: uuid}
        event_state: {type: string, enum: [PENDING, PUBLISHED]}
    AssignmentListResponse:
      type: object
      required: [data, page, page_size, total_count, correlation_id]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/Assignment'}
        page: {type: integer, minimum: 1}
        page_size: {type: integer, minimum: 1}
        total_count: {type: integer, minimum: 0}
        correlation_id: {type: string}
    ErrorResponse:
      type: object
      required: [code, message, correlation_id]
      properties:
        code: {type: string}
        message: {type: string}
        correlation_id: {type: string, maxLength: 128}
    StatusResponse:
      type: object
      required: [status, mysql, redis]
      properties:
        status: {type: string, enum: [ok, ready, not_ready]}
        mysql: {type: string, enum: [ok, unavailable]}
        redis: {type: string, enum: [ok, unavailable]}
  responses:
    BadRequest:
      description: Missing or malformed request.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example:
            code: INVALID_REQUEST
            message: invalid request
            correlation_id: corr-001
      headers:
        X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
    InvalidCredentials:
      description: Generic authentication failure; user existence is not disclosed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example:
            code: AUTH_INVALID_CREDENTIALS
            message: invalid credentials
            correlation_id: corr-login-001
      headers:
        X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
    InvalidSession:
      description: Missing, invalid, expired, revoked, or reused session/token.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example:
            code: AUTH_INVALID_SESSION
            message: invalid or expired session
            correlation_id: corr-session-001
      headers:
        X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
    Forbidden:
      description: Role, organisation, object, or assignment scope denied.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example:
            code: FORBIDDEN
            message: access denied
            correlation_id: corr-forbidden-001
      headers:
        X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
    NotFound:
      description: Resource not found or concealed by object-scope policy.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example:
            code: NOT_FOUND
            message: resource not found
            correlation_id: corr-not-found-001
      headers:
        X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
    Conflict:
      description: Stale version, invalid state, duplicate claim, or replay hash conflict.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example:
            code: STALE_VERSION
            message: The resource has changed. Refresh and retry.
            correlation_id: corr-conflict-001
      headers:
        X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
    ValidationError:
      description: Valid JSON with an invalid business value; no successful domain write.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example:
            code: VALIDATION_ERROR
            message: one or more fields are invalid
            correlation_id: corr-validation-001
      headers:
        X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
    RateLimited:
      description: Too many login or refresh requests from the client address.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example:
            code: AUTH_RATE_LIMITED
            message: too many requests
            correlation_id: corr-rate-001
      headers:
        X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
    ServiceUnavailable:
      description: A required dependency is unavailable.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example:
            code: SERVICE_UNAVAILABLE
            message: service temporarily unavailable
            correlation_id: corr-service-001
      headers:
        X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
