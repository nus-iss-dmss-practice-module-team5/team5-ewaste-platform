mode: development

server:
  port: ":8080"
  allowed_origins:
    - "http://localhost:3000"

database:
  host: "localhost"
  port: 3306
  name: "ewaste"
  user: "ewaste_app"
  # Supply the password through MYSQL_PASSWORD.
  password: ""

redis:
  address: "localhost:6379"
  # Supply the password through REDIS_PASSWORD.
  password: ""
  db: 0
  tls_enabled: false

kafka:
  enabled: false
  brokers:
    - "localhost:9092"
  client_id: "workflow-api"
  publish_interval: "1s"
  batch_size: 50
  max_attempts: 5
  lease_duration: "30s"
  leader_lease_duration: "30s"
  retry_backoff: "5s"
  publish_timeout: "10s"

auth:
  issuer: "ewaste-workflow-api"
  access_secret: ""
  refresh_secret: ""
  refresh_hash_secret: ""
  access_ttl: "15m"
  refresh_ttl: "24h"

rate_limit:
  requests: 10
  window: "1m"

logging:
  level: "info"
  file_path: "logs/workflow-api.log"
  max_size_mb: 10
  max_backups: 5
  max_age_days: 30
  compress: true
  console: true
