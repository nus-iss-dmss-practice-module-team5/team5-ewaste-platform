mode: development

server:
  port: ":8080"

database:
  # Example only. Supply the real DSN through EWASTE_DATABASE_DSN or a local config.yaml.
  dsn: "ewaste_app:replace-me@tcp(localhost:3306)/ewaste?charset=utf8mb4&parseTime=True&loc=UTC"

redis:
  address: "localhost:6379"
  password: ""
  db: 0

auth:
  issuer: "ewaste-workflow-api"
  access_secret: "replace-with-a-long-random-access-secret"
  refresh_secret: "replace-with-a-long-random-refresh-secret"
  refresh_hash_secret: "replace-with-a-long-random-refresh-hash-secret"
  access_ttl: "15m"
  refresh_ttl: "24h"

rate_limit:
  requests: 10
  window: "1m"

logging:
  level: "info"
  file_path: "logs/workflow-api.log"
  max_size_mb: 10
  max_backups: 5
  max_age_days: 30
  compress: true
  console: true
